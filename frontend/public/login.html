<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - FreelanceFinanceHub</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="container">
    <div class="card auth-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Iniciar Sesión</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
        Ingresa a tu cuenta de FreelanceFinanceHub
      </p>

      <div id="loginAlert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 1rem;">Iniciar Sesión</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/api/apiClient.js"></script>
  <script src="/assets/js/utils/routeGuard.js"></script>
  <script src="/assets/js/modules/authView.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth({ requireAuth: false, redirectToIfAuth: '/dashboard' });
      setupLoginForm();
    });
  </script>
</body>
</html>
