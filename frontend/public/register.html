<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - FreelanceFinanceHub</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="container">
    <div class="card auth-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Crear Cuenta</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
        Comienza a optimizar tus finanzas freelance
      </p>

      <div id="registerAlert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Nombre completo</label>
          <input type="text" id="fullName" class="form-input" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" required autocomplete="new-password">
          <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 0.35rem;">
            Mínimo 8 caracteres, con mayúscula, minúscula y número.
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" class="form-input" required autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 1rem;">Crear Cuenta</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/api/apiClient.js"></script>
  <script src="/assets/js/utils/routeGuard.js"></script>
  <script src="/assets/js/modules/authView.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth({ requireAuth: false, redirectToIfAuth: '/dashboard' });
      setupRegisterForm();
    });
  </script>
</body>
</html>
